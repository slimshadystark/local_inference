name: local_inference
description: >-
  Run LLMs and AI agents on device in Dart: GGUF models via llama.cpp, tool calling, an agent loop with your own
  tools, verified downloads. Offline and private.
version: 0.1.1
repository: https://github.com/slimshadystark/local_inference/tree/main/packages/local_inference
issue_tracker: https://github.com/slimshadystark/local_inference/issues
resolution: workspace
topics:
  - llm
  - ai
  - agents
  - on-device
  - llama-cpp
screenshots:
  - description: 'li_chat, the example: a terminal chat whose model calls two tools, the time and a calculator.'
    path: screenshots/terminal.png

# The platforms with a llama.cpp bundle in tool/native/bundles.txt (Linux: built, not yet run). Windows has none.
platforms:
  android:
  ios:
  linux:
  macos:

environment:
  sdk: ^3.10.7

dependencies:
  llamadart: 0.8.23
  dinja: '>=1.0.0 <1.1.0'
  crypto: ^3.0.7
  meta: ^1.18.0
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
