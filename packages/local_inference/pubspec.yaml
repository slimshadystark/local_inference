name: local_inference
description: >-
  On-device LLM inference in pure Dart on llama.cpp: chat templates, tool calling with GBNF grammars, a tool-using
  assistant and verified model downloads.
version: 0.1.0
repository: https://github.com/slimshadystark/local_inference/tree/main/packages/local_inference
issue_tracker: https://github.com/slimshadystark/local_inference/issues
resolution: workspace
topics:
  - llm
  - llama-cpp
  - on-device-ai
  - ai
  - tool-calling

environment:
  sdk: ^3.10.7

dependencies:
  llamadart: 0.8.23
  dinja: '>=1.0.0 <1.1.0'
  crypto: ^3.0.7
  meta: ^1.18.0
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
