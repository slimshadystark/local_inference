name: li_chat
description: A terminal chat over local_inference with two tools (the time and a calculator). An example, not a member
  of the workspace.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.7

dependencies:
  local_inference:            # the package of this repository; an app of your own lists local_inference: ^0.1.0
    path: ..

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

# Read by llamadart's build hook from the app's own pubspec: the llama.cpp runtime only, never LiteRT-LM. There is no
# llamadart_native_path: the example takes the hook's default, a download of the native bundle into the pub cache.
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
