name: local_inference_flutter
description: >-
  On-device AI chat and agents for Flutter: a drop-in customizable chat UI, tool calling, background model
  downloads, GGUF models via llama.cpp. Offline and private.
version: 0.1.1
repository: https://github.com/slimshadystark/local_inference/tree/main/packages/local_inference_flutter
issue_tracker: https://github.com/slimshadystark/local_inference/issues
resolution: workspace
topics:
  - llm
  - ai
  - chat
  - agents
  - on-device
screenshots:
  - description: 'Tool calling on device: the model calls Dart functions and answers from their results.'
    path: screenshots/1_tool_calling.png
  - description: 'An irreversible tool waits for the user: the chat asks with Yes and No buttons.'
    path: screenshots/2_confirmation.png
  - description: 'Model setup: consent, a background download with progress, a checked file, then offline use.'
    path: screenshots/3_model_download.png
  - description: 'The same chat restyled with LocalInferenceTheme, custom strings and builders, in dark mode.'
    path: screenshots/4_custom_theme.png
  - description: 'A built-in AI disclosure banner and an in-app report sheet for replies.'
    path: screenshots/5_disclosure_and_reports.png

# The platforms pub.dev lists: those of the device plugin (android/, darwin/). On Linux and Windows the plugin only
# registers the native licenses (NativeLicenses); those platforms are not tested.
platforms:
  android:
  ios:
  macos:

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  local_inference: ^0.1.0
  background_downloader: '>=9.5.9 <9.7.0'
  meta: ^1.18.0
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  crypto: ^3.0.7
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  plugin:
    platforms:
      android:
        package: it.asfweb.local_inference_flutter
        pluginClass: LocalInferenceFlutterPlugin
        dartPluginClass: NativeLicenses
      ios:
        pluginClass: LocalInferenceFlutterPlugin
        dartPluginClass: NativeLicenses
        sharedDarwinSource: true
      linux:
        dartPluginClass: NativeLicenses
      macos:
        pluginClass: LocalInferenceFlutterPlugin
        dartPluginClass: NativeLicenses
        sharedDarwinSource: true
      windows:
        dartPluginClass: NativeLicenses
