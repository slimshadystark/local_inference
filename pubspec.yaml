name: local_inference_workspace
description: Pub workspace of local_inference and local_inference_flutter. Not a package; see packages/.
publish_to: none

environment:
  sdk: ^3.10.7

workspace:
  - packages/local_inference
  - packages/local_inference_flutter

# tool/ci/snippets.dart and its test (tool/test/).
dev_dependencies:
  path: ^1.9.0
  test: ^1.25.0
  yaml: ^3.1.3

# Read by llamadart's build hook for every dart/flutter run, test and build inside the workspace (a member's own
# hooks block is ignored). llama_cpp only: without this, llamadart also bundles LiteRT-LM.
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
